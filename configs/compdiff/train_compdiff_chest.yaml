# CompDiff training configuration - chest X-ray (MIMIC-CXR)
#
# The configuration of the released chest model (Hugging Face
# mahmoudibra98/compdiff-chest-xray): typed compositional conditioner with
# sex, race and continuous age composed inside the conditioner and emitted as
# four cross-attention tokens (t_age, t_sex, t_race, t_cls), each supervised by
# its own auxiliary head. Demographics are stripped from the text prompt in
# training and validation; the text encoder sees clinical findings only.
#
# Paths below point at the demo WebDatasets; replace them with your own
# MIMIC-CXR WebDataset (see prepare_datasets/prepare_chest_dataset.py).
# Trained on 6 GPUs at train_batch_size 8 (global batch 48), 30k steps; the
# released checkpoint is step 10,000, selected on the validation split.
#
pretrained_model_name_or_path: "stabilityai/stable-diffusion-2-1-base"
pretrained_text_encoder_name_or_path: null
train_text_encoder: true

embedding_method: "last_hidden_state"
enforce_tokenizer_max_sentence_length: 77
output_dir: "./outputs/compdiff/chest"
seed: 42
resolution: 512

train_batch_size: 8
max_train_steps: 30000
learning_rate: 1.0e-5
gradient_accumulation_steps: 1
mixed_precision: "bf16"
use_ema: true
lr_scheduler: "cosine"
lr_warmup_steps: 500
gradient_checkpointing: true

# ==============================================================================
# DATASET CONFIGURATION
# ==============================================================================

use_wds_dataset: true
url_root: "./demo_chest/training_data"
image_type: "pt"

# ==============================================================================
# TEST DATASET Generation
# ==============================================================================

wds_dataset_path: "./demo_chest/test_data"
num_images_per_prompt: 1
generation_batch_size: 8

# ==============================================================================
# CHECKPOINTING
# ==============================================================================

checkpointing_steps: 500
checkpoints_total_limit: None
resume_from_checkpoint: "latest"

# ==============================================================================
# CompDiff-2: TYPED COMPOSITIONAL CONDITIONER
# ==============================================================================

# Reuse the HCN slot in train/validation/dataset plumbing
use_hcn: true
use_hcn_v7: false
use_compdiff2: true

# Stage switches
cd2_composer: "hierarchical"        # hierarchical | transformer
cd2_multi_token: true
cd2_route_b: false
cd2_num_registers: 0
cd2_attr_dropout_prob: 0.0
cd2_full_dropout_prob: 0.0

# Typed age encoder
cd2_age_freq_dim: 128
max_age: 100

# Aux loss shape
cd2_aux_weight_joint: 0.5
cd2_age_loss_scale: 10.0

# Transformer composer size (ignored unless cd2_composer=transformer)
cd2_transformer_layers: 2
cd2_transformer_heads: 4

# Shared conditioner dimensions (same as CompDiff-1 for comparability)
hcn_d_node: 256
hcn_d_ctx: 1024
hcn_d_time_emb: 1280
hcn_dropout: 0.1
hcn_use_uncertainty: true
hcn_aux_hidden_dim: 512

# Category counts (age bins ONLY feed the joint aux head + monitoring)
hcn_num_age_bins: 5
hcn_num_sex: 2
hcn_num_race: 4

# Loss weights (identical to CompDiff-1 defaults for comparability)
hcn_kl_weight: 0.005
hcn_kl_anneal_steps: 5000
hcn_comp_weight: 0.1
hcn_aux_weight: 1

# ==============================================================================
# VALIDATION CONFIGURATION
# ==============================================================================

run_validation: true
validation_steps: 2500
num_validation_samples: -1
validation_schedule_offsets:
  - -1500
  - 0
val_batch_size: 16 # 16 for a100, 8 for a5000 or rtx4090
validation_csv: "./demo_chest/val_data"
validation_images_dir: "./demo_chest/val_data"
validation_sex_model_path: "./pretrained_models/sex/resnet-all/epoch=13-step=7125.ckpt"
validation_num_images_per_prompt: 1
validation_guidance_scale: 7.5
validation_num_inference_steps: 75
validation_save_images: true
validation_metrics_batch_size: 8 # always keep at 8, regardless of gpu memory
compute_subgroup_metrics: true
# Age is inside the conditioner for CompDiff-2 -> strip the FULL demographic
# prefix (including age) from prompts, in training (dataset default) and here.
strip_demographics_in_validation: true
test_dir: "./demo_chest/test_data"

# ==============================================================================
# LOGGING
# ==============================================================================

logging_dir: "logs/compdiff/chest"
report_to: "wandb"

# Barrier wait for straggler ranks during (test-scale) generation; 1800 default killed the 7039-image main test
validation_generation_timeout: 14400
